[package]
name = "h3-desktop"
version = "0.3.0"
description = "H3 — Tauri shell for native Metal MiniMax-H3"
authors = ["Danmo AI"]
edition = "2021"

[workspace]

[lib]
name = "h3_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "h3-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
